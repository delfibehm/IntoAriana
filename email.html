<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
<body style="margin:0;padding:0;">

  <!-- contenedor general -->
  <table 
    width="100%" 
    cellpadding="0" 
    cellspacing="0" 
    border="0" 
    style="max-width:600px; margin:0 auto; border-collapse:collapse;"
  >
    <tr>
      <td 
        style="padding:20px 0; text-align:center; background-color:#ffeef2;"
      >
        <!-- logo -->
        <img 
          src="https://delfibehm.github.io/IntoAriana/logo%20posta.PNG" 
          alt="Into Ariana Logo" 
          width="150" 
          style="display:block; margin:0 auto; border:0;"
        />
      </td>
    </tr>

    <!-- sección principal en 2 columnas -->
    <tr>
      <td style="padding:20px; background-color:#fde6ed;">
        <table 
          width="100%" 
          cellpadding="0" 
          cellspacing="0" 
          border="0" 
          style="border-collapse:collapse;"
        >
          <tr style="display: flex; flex-flow: wrap; justify-content: center;">
            <!-- columna izquierda -->
            <td 
              valign="top" 
              style="width: 50%; min-width: 260px; box-sizing: border-box; text-align: center; padding-top: 10px;"
            >

            <h2 
                style="margin:0 0 10px; font-family:monospace; font-size:18px; color:#333; text-align: center; padding-bottom: 15px; padding-top: 15px;"
              >Ultimas novedades</h2>

              <img 
                src="https://delfibehm.github.io/IntoAriana/arianaemail1.PNG" 
                alt="Imagen 1" 
                width="100%" 
                style="display:block; margin:0 auto 10px; width: 100%; max-height: 200px; object-fit: cover; border: 0;"
              />
              
              <a 
                href="https://delfibehm.github.io/IntoAriana/novedades.html" target="_blank" class="ad-button"
                style="
                  display:inline-block;
                  padding:8px 16px;
                  background-color:#fcd6e3;
                  color:#333;
                  text-decoration:none;
                  font-family:monospace;
                  border:1px solid #f69db3;
                  border-radius:4px;

                "
              >Ver novedades</a>
            </td>

            <!-- columna derecha -->
            <td 
              valign="top" 
              style="padding-left:10px; width: 50%; min-width: 260px; box-sizing: border-box; text-align: center; padding-top: 10px;"
            >

             <h2 
                style="margin:0 0 10px; font-family:monospace; font-size:18px; color:#333; text-align: center; padding-bottom: 15px; padding-top: 15px;"
              >Subscribete al fan membership</h2>

              <img 
                src="https://delfibehm.github.io/IntoAriana/arianaemail2.PNG" 
                alt="Imagen 2" 
                width="100%" 
                style="display:block; margin: 0 auto 10px; width: 100%; max-height: 200px; object-fit: cover; border: 0;"
              />
             
              <a 
                href="https://delfibehm.github.io/IntoAriana/subscribe.html" target="_blank" class="ad-button"
                style="
                  display:inline-block;
                  padding:8px 16px;
                  background-color:#fcd6e3;
                  color:#333;
                  text-decoration:none;
                  font-family:monospace;
                  border:1px solid #f69db3;
                  border-radius:4px;
                "
              >Subscribe</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- footer -->
    <tr>
      <td 
        style="padding:12px; text-align:center; font-size:12px; color:#777; background-color:#fde6ed;"
      >
        &copy; 2025 Into Ariana. Todos los derechos reservados.
      </td>
    </tr>
  </table>
</body>
</html>
